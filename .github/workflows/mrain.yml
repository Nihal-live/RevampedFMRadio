name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'zulu'

    # Fix Android SDK setup
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Accept Android Licenses
      run: |
        yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
        ./gradlew --stop

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean assembleDebug --stacktrace --no-daemon
      env:
        ORG_GRADLE_PROJECT_android.useAndroidX: true
        ORG_GRADLE_PROJECT_android.enableJetifier: true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RevampedFMRadio-APK
        path: app/build/outputs/apk/debug/*.apk
